<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sticky view timeline fixture</title>
  <style data-aphrodite>
    body { margin: 0; font: 14px system-ui; }
    .spacer { block-size: 400px; }
    #runway { position: relative; block-size: 3000px; }
    #track { position: sticky; top: 0; block-size: 100vh; }
    #pinned { block-size: 300px; margin-block-start: 100px; background: #eee; }
    #plain { block-size: 300px; background: #ccc; }
    /* Sticky boxes whose in-flow place is not under their previous sibling. */
    #row { display: flex; gap: 40px; align-items: flex-start; block-size: 2000px; }
    #row > .lead { flex: 1; block-size: 1200px; background: #eee; }
    #column { display: flex; flex-direction: column; gap: 60px; block-size: 2400px; }
    #column > .lead { block-size: 300px; margin-block-end: 20px; background: #eee; }
    #grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px 20px; block-size: 2400px; align-items: start; }
    #grid > .lead { block-size: 500px; background: #eee; }
    .sticky { position: sticky; top: 0; flex: 1; margin-block-start: 10px; }
    .sticky > div { block-size: 200px; background: #ccc; }
    .tail { block-size: 2000px; }
  </style>
  <style id="fixture-css">
    @keyframes fixture-fade { from { opacity: 0; } to { opacity: 1; } }
    #pinned { view-timeline: --pinned block; }
    #pinned-exit { animation: fixture-fade auto linear both; animation-timeline: --pinned; animation-range: exit; }
  </style>
  <script type="module" src="./fixtures/sticky.ts"></script>
</head>
<body>
  <div class="spacer"></div>
  <div id="runway"><div id="track"><div id="pinned"><div id="pinned-exit">exit range</div></div></div></div>
  <div id="plain"></div>
  <div id="row"><div class="lead"></div><div class="sticky"><div id="row-subject"></div></div></div>
  <div id="column"><div class="lead"></div><div class="sticky"><div id="column-subject"></div></div></div>
  <div id="grid"><div class="lead"></div><div class="lead"></div><div class="sticky"><div id="grid-subject"></div></div></div>
  <div class="tail"></div>
</body>
</html>
