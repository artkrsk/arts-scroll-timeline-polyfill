<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scroll timeline shipped-bundle regression fixture</title>
  <style data-aphrodite>
    body { font: 14px system-ui; --offset: 40px; }
    #scroller { block-size: 300px; inline-size: 360px; overflow: auto; border: 1px solid; }
    .spacer { block-size: 300px; }
    #subject { block-size: 600px; position: relative; background: #eee; }
    .probe { block-size: 30px; inline-size: 100px; background: #247; color: white; margin-block: 5px; }
    #result { white-space: pre-wrap; }
  </style>
  <style id="hostile-css"> { animation-timeline: --invalid; }</style>
  <style id="opted-out-css" data-aphrodite>.ignored { animation-timeline: --ignored; }</style>
  <style id="fixture-css">
    @keyframes fixture-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fixture-move { from { translate: 0 0; } to { translate: 100px 0; } }
    #subject { view-timeline: --fixture block; view-timeline-inset: var(--offset, var(--fallback, 0px)) 0px; }
    #longhand { animation-name: fixture-fade; animation-duration: auto; animation-timing-function: linear; animation-fill-mode: none; animation-timeline: --fixture; animation-range: cover; }
    #shorthand { animation: fixture-fade auto cubic-bezier(0, 0, 1, 1); animation-timeline: --fixture; animation-range: cover; }
    #omitted { animation-name: fixture-fade; animation-timing-function: linear; animation-timeline: --fixture; animation-range: cover; }
    #explicit { animation: fixture-fade 2s linear both; animation-timeline: --fixture; animation-range: cover; }
    #list { animation: fixture-fade auto linear both, fixture-move 2s linear both; animation-timeline: --fixture, --fixture; animation-range: cover, cover; }
    #important { animation: fixture-fade auto!important; animation-timeline: --fixture !important; }
    #zero-subject { block-size: 300px; view-timeline: --zero block; }
    #zero-probe { animation: fixture-fade auto linear both; animation-timeline: --zero; animation-range: contain; }
  </style>
  <script type="module" src="./fixtures/parity.ts"></script>
</head>
<body>
  <h1>Shipped bundle regression fixture</h1>
  <p>Runs on native and polyfilled browser engines. Results are also available in <code>window.__artsParityFixture</code>.</p>
  <div id="scroller"><div class="spacer"></div><div id="subject">
    <div id="longhand" class="probe">longhand auto</div>
    <div id="shorthand" class="probe">shorthand auto</div>
    <div id="omitted" class="probe">omitted duration</div>
    <div id="explicit" class="probe">explicit duration</div>
    <div id="list" class="probe">animation list</div>
    <div id="important" class="probe">important shorthand</div>
  </div><div id="zero-subject"><div id="zero-probe" class="probe">zero contain range</div></div><div class="spacer"></div></div>
  <pre id="result">Running…</pre>
</body>
</html>
